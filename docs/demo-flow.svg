<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Feature Delivery Risk Simulator核心流程</title>
  <desc id="desc">从AN03动画延期到依赖传播、Alpha风险、B+C决策、Replan与剩余风险的完整流程</desc>
  <rect width="1200" height="520" fill="#f4f6f8"/>
  <rect x="40" y="36" width="1120" height="448" rx="18" fill="#ffffff" stroke="#dce2e8"/>
  <text x="76" y="88" font-family="Arial, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#17212b">游戏研发Feature交付风险分析模拟器</text>
  <text x="76" y="116" font-family="Arial, sans-serif" font-size="14" fill="#687586">Feature Delivery Risk Simulator · 多人首领Feature / D40 Alpha</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <g transform="translate(76 162)"><rect width="230" height="104" rx="10" fill="#fff3ef" stroke="#e77d5f"/><text x="18" y="28" font-size="11" font-weight="700" fill="#c4320a">01 · DEVIATION</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17212b">AN03关键动画 +3D</text><text x="18" y="80" font-size="12" fill="#687586">机制可读性返工</text></g>
    <text x="324" y="220" font-size="28" fill="#98a2b3">→</text>
    <g transform="translate(366 162)"><rect width="360" height="104" rx="10" fill="#f8fafc" stroke="#cfd7df"/><text x="18" y="28" font-size="11" font-weight="700" fill="#155eef">02 · DEPENDENCY IMPACT</text><text x="18" y="55" font-size="16" font-weight="700" fill="#17212b">Event → VFX → Integration</text><text x="18" y="80" font-size="12" fill="#687586">Multiplayer Validation → QA</text></g>
    <text x="744" y="220" font-size="28" fill="#98a2b3">→</text>
    <g transform="translate(786 162)"><rect width="330" height="104" rx="10" fill="#fff3ef" stroke="#e77d5f"/><text x="18" y="28" font-size="11" font-weight="700" fill="#c4320a">03 · MILESTONE RISK</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17212b">D40 Alpha进入风险</text><text x="18" y="80" font-size="12" fill="#687586">未重排风险暴露 ≈ D43</text></g>
    <g transform="translate(76 320)"><rect width="300" height="104" rx="10" fill="#edf4ff" stroke="#80aaff"/><text x="18" y="28" font-size="11" font-weight="700" fill="#155eef">04 · HUMAN DECISION</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17212b">Critical First + Placeholder</text><text x="18" y="80" font-size="12" fill="#687586">B + C人工决策组合</text></g>
    <text x="394" y="378" font-size="28" fill="#98a2b3">→</text>
    <g transform="translate(436 320)"><rect width="300" height="104" rx="10" fill="#ecfdf3" stroke="#66c79a"/><text x="18" y="28" font-size="11" font-weight="700" fill="#087a4b">05 · REPLAN</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17212b">D40核心Scope具备可行路径</text><text x="18" y="80" font-size="12" fill="#687586">风险重新进入可管理状态</text></g>
    <text x="754" y="378" font-size="28" fill="#98a2b3">→</text>
    <g transform="translate(796 320)"><rect width="320" height="104" rx="10" fill="#fff7e8" stroke="#efb15a"/><text x="18" y="28" font-size="11" font-weight="700" fill="#b54708">06 · RESIDUAL RISK</text><text x="18" y="55" font-size="17" font-weight="700" fill="#17212b">风险没有消失</text><text x="18" y="80" font-size="12" fill="#687586">替换 / 可读性 / 回归 / 资源</text></g>
  </g>
</svg>

